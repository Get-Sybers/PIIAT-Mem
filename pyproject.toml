[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "piiat-mem"
version = "0.4.0"
description = "Put It In A Timeline (Memory) — a memory image to a MITRE CAR event store and timeline (Volatility 3, DFIR plugins, hardened container)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Get-Sybers" }]
keywords = ["dfir", "forensics", "volatility", "memory", "timeline", "incident-response"]

# Runtime needs only the standard library + Docker (the default backend runs the
# hardened container). Installing Volatility 3 enables --native.
dependencies = []

[project.optional-dependencies]
native = ["volatility3>=2.4"]

[project.scripts]
piiat-mem = "piiat_mem.cli:main"

[tool.setuptools]
packages = ["piiat_mem"]
# ship the runtime assets so an installed copy can still find them (the custom
# plugins live nested at plugins/windows/piiat/ — glob each level explicitly,
# setuptools package-data does not expand **)
[tool.setuptools.package-data]
piiat_mem = ["car_data_model.json"]
"*" = ["../plugins/*.py", "../plugins/windows/*.py",
       "../plugins/windows/piiat/*.py", "../jsonl_dfir_renderer.py"]
